<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="login.css">
    <title>Login - iFound Campus Rosário</title>
</head>
<body>

    <main class="login-wrapper">
        <!-- Container Central -->
        <section class="login-container">
            <div class="logo">
                <img src="Imagens/logo.png" alt="Logo iFound"> <!-- Ajuste o caminho da imagem aqui -->
                <h1>iFound</h1>
                <p>Campus Rosário</p>
            </div>

            <div class="welcome-text">
                <h2>Bem-vindo de volta!</h2>
                <p>Entre para continuar conectando pessoas e coisas.</p>
            </div>

            <form action="/login" method="POST" id="login-form">
                <div class="input-group">
                    <label for="user-identifier">E-mail</label>
                    <input type="email" id="user-identifier" name="user_identifier" placeholder="Digite seu e-mail acadêmico" required>
                </div>

                <div class="input-group">
                    <div class="password-header">
                        <label for="password">Senha</label>
                        <a href="/recuperar-senha" class="forgot-password">Esqueceu a senha?</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>

                <div class="divider">ou</div>

                <a href="Cadastro.html" class="btn-secondary">Criar nova conta</a>
            </form>

            <p class="terms">Ao continuar, você concorda com os <strong>Termos de uso</strong> e <strong>Política de privacidade</strong>.</p>
        </section>
    </main>

    <!-- Rodapé específico da referência -->
    <footer class="main-footer">
        <div class="footer-content">
            <img src="Imagens/logo.png" alt="Logo iFound"> <!-- Ajuste o caminho da imagem aqui -->
            <div class="footer-text">
                <p class="brand"><strong>iFound</strong> • Campus Rosário</p>
                <p class="copyright">© 2024 IFMA Campus Rosário. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>
 <script src="login.js"></script>
</body>
</html>
