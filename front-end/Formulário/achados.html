<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="achados.css">
    <title>iFound - Formulário de Achado</title>
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=_OyCOLH-KMlipeSv2KHgiBVz5r7K5mNgpLhV1iyeZ6QP678N0RS23Qw849a8oh8QSOOvK4EvaRV8UZL67QIQNTbgYPGqNLrrqK9noOSkVtiaWq-_MHOf-kHmnl6FU2eW668oWSJUm6OcMyeyTlXCs6znbr20FlPARveSm9PBv__RSBrvfTKPIAl8ObaEIxUtpqzxvOoVj4FUH6HirzJn-Er8PJEPVsIILvCN4M0-dDGkJECsutbvqaY6OytbA30vBDJOS7EY2FRu3ycLMvRTSvtAhpD5HthZgdNlWcdn7b-DxGJ8_FvuydtszdWvXSuBv1cslUdAg8qpKBQVgLw3yw" charset="UTF-8"></script></head>
<body>

    <div class="pagina-ifound">

        <aside class="menu-lateral">
            <div class="marca">
                <img src="imagens/Ifound.png" alt="Logo iFound">
            </div>

            <nav class="menu">
                <a class="menu-item" href="../iFound.html#inicio">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
                    <span>Início</span>
                </a>

                <a class="menu-item" href="../iFound.html#mural">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
                    <span>Mural</span>
                </a>

                <a class="menu-item destaque" href="../iFound.html#publicacoes">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
                    <span>Publicar</span>
                </a>

                <a class="menu-item" href="../iFound.html#busca">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
                    <span>Busca</span>
                </a>

                <a class="menu-item" href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
                    <span>Notificações</span>
                </a>
            </nav>

            <div class="frase-campus">
                <div class="icone-campus">
                    <svg viewBox="0 0 90 82" aria-hidden="true">
                        <path d="M7 69V48l18-9v30M25 69V27h18v42M43 69V18h14v51M57 69V39l18 9v21M35 27v-8h-4v-5h8v13M48 18V8h5v10M12 53h8M30 36h8M30 46h8M48 28h6M48 38h6M63 50h7"/>
                    </svg>
                </div>
                <p>Juntos por um<br>campus mais<br>conectado!</p>
            </div>
        </aside>

        <main class="conteudo-formulario">
            <div class="decoracao-pontos pontos-topo"></div>
            <div class="arco arco-vinho"></div>
            <div class="arco arco-verde"></div>
            <div class="arco arco-amarelo"></div>

            <a href="../iFound.html" class="voltar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                Voltar
            </a>

            <section class="cabecalho-formulario">
                <div class="icone-titulo-formulario">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
                </div>

                <div class="texto-titulo">
                    <h1>Formulário de Achado</h1>
                    <p>Encontre o que é seu! Preencha os dados do item encontrado para que o dono possa recuperá-lo.</p>
                </div>
            </section>

            <form class="formulario">
                <div class="grupo-campo">
                    <label for="titulo">Título do item <span>*</span></label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex: Chave do carro" required>
                </div>

                <div class="grupo-campo">
                    <label for="descricao">Descrição <span>*</span></label>
                    <div class="textarea-area">
                        <textarea id="descricao" name="descricao" maxlength="350" placeholder="Conte detalhes sobre o item, onde foi encontrado, etc." required></textarea>
                        <span class="contador">0/350</span>
                    </div>
                </div>

                <div class="grupo-campo">
                    <label for="local">Local onde foi encontrado <span>*</span></label>
                    <input type="text" id="local" name="local" placeholder="Ex: Bloco B, sala 12" required>
                </div>

                <div class="grupo-campo">
                    <label for="data">Data do achado <span>*</span></label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div class="grupo-campo">
                    <label for="fotos">Fotos</label>
                    <label class="upload-area" for="fotos">
                        <input type="file" id="fotos" name="fotos" accept="image/*" multiple>
                        <svg class="camera" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v10H4z"/><circle cx="12" cy="13" r="3"/></svg>
                        <span class="upload-texto">Selecione ou arraste as fotos</span>
                        <span class="upload-legenda">(até 3 imagens)</span>
                    </label>
                </div>

                <button type="submit" class="btn-publicar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8z"/><path d="m11 13 10-10"/></svg>
                    Publicar achado
                </button>
            </form>
        </main>

    </div>

</body>
</html>
