<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doações - iFound Campus Rosário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Doacoes.css">
    <link rel="stylesheet" href="../Ifound.css">
</head>
<body>

    <!-- ================= CABEÇALHO ================= -->
    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <a href="../iFound.html" class="logo">
                <span class="logo-icone"><img src="../Imagens/ItensIlu.png" alt="" srcset=""></span>
                <span class="logo-texto">
                    <strong>iFound</strong>
                    <small>Campus Rosário</small>
                </span>
            </a>

            <label class="busca-topo">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
                <input type="search" id="campo-busca" placeholder="Buscar item, descrição ou categoria..." aria-label="Buscar doações">
            </label>

            <div class="acesso-usuario">
                <a href="../login.html" class="btn btn-contorno">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                    Entrar
                </a>
                <a href="../cadastro.html" class="btn btn-vinho">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4.4 3.6-7 8-7s8 2.6 8 7M19 6v6M16 9h6"/></svg>
                    Cadastrar
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="secao">
            <div class="pagina-titulo">
                <a href="../iFound.html" class="btn-voltar" aria-label="Voltar para a página inicial">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                </a>
                <h1>Doações</h1>
            </div>

            <p class="sem-resultado" id="sem-resultado" hidden>Nenhuma doação encontrada para essa busca. Tente outra palavra.</p>

            <!-- Os cards são gerados pelo Doacoes.js a partir da lista de itens -->
            <div class="grid-publicacoes grid-doacoes" id="lista-doacoes"></div>
        </section>
    </main>

    <!-- ================= RODAPÉ ================= -->
   <div id="rodape"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="Doacoes.js"></script>
    <script src="../rodape.js"></script>
</body>
</html>
