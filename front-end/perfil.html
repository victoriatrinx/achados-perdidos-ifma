<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iFound | Meu perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="perfil.css">
<link rel="stylesheet" href="paginas-app.css">
<script src="shell.js"></script>
<script>
/* Diagnóstico TEMPORÁRIO: mostra erros do perfil na própria página (pode apagar depois) */
function erroNaTela(t){
  var d = document.getElementById("erroTela");
  if(!d){
    d = document.createElement("div"); d.id = "erroTela";
    d.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:999;background:#b00020;color:#fff;padding:10px 14px;font:600 14px/1.4 sans-serif";
    document.body.appendChild(d);
  }
  d.textContent = "ERRO: " + t;
}
window.addEventListener("error", function(e){
  if(e.target && e.target.tagName === "SCRIPT") erroNaTela("não consegui carregar " + e.target.getAttribute("src"));
  else if(e.message) erroNaTela(e.message + " (" + String(e.filename || "").split("/").pop() + ", linha " + e.lineno + ")");
}, true);
window.addEventListener("load", function(){
  if(!window.__perfilJs) erroNaTela("o perfil.js não rodou. Ele precisa estar na mesma pasta do perfil.html.");
});
</script>
</head>
<body>

<script>IFShell.topo('perfil')</script>

<main class="pagina">
  <section class="perfil-painel" aria-labelledby="tituloPerfil">
    <div class="perfil-titulo">
      <a class="voltar" href="home.html" aria-label="Voltar para o início">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
      </a>
      <h1 id="tituloPerfil">Perfil</h1>
    </div>

    <!-- Dados da pessoa -->
    <article class="perfil-cartao perfil-dados">
      <div class="perfil-foto-box">
        <span class="perfil-foto" id="perfilFoto" aria-hidden="true"></span>
        <button class="btn-camera" id="btnCamera" type="button" aria-label="Trocar foto de perfil">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
      </div>
      <div class="perfil-nome">
        <h2 id="perfilNome">Aluno(a)</h2>
        <p id="perfilUsuario">@aluno(a)</p>
      </div>
      <button class="btn-editar" id="btnEditar" type="button" aria-label="Editar perfil">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L17 4l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
      </button>
    </article>

    <!-- Números -->
    <article class="perfil-cartao perfil-numeros">
      <div class="numero">
        <span class="icone-redondo">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l7 4V6L7 10z"/><path d="M17.5 9a4 4 0 010 6"/></svg>
        </span>
        <p><strong id="statAnuncios">0</strong><span>Anúncios publicados</span></p>
      </div>
      <div class="numero">
        <span class="icone-redondo">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.600-7 10-7 10z"/></svg>
        </span>
        <p><strong id="statFavoritos">0</strong><span>Favoritos</span></p>
      </div>
    </article>

    <!-- Atalhos -->
    <nav class="perfil-cartao perfil-atalhos" aria-label="Atalhos do perfil">
      <a class="atalho" href="meus-anuncios.html" >
        <span class="icone-redondo">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 4h6"/></svg>
        </span>
        <span class="atalho-texto"><strong>Meus Anúncios</strong><small>Gerencie suas publicações</small></span>
        <span class="atalho-seta" aria-hidden="true">›</span>
      </a>
      <a class="atalho" href="favoritos.html" >
        <span class="icone-redondo">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.400-7-10a4 4 0 017-2.600A4 4 0 0119 10c0 5.600-7 10-7 10z"/></svg>
        </span>
        <span class="atalho-texto"><strong>Favoritos</strong><small>Itens que você salvou</small></span>
        <span class="atalho-seta" aria-hidden="true">›</span>
      </a>
      
      <a class="atalho" href="configuracoes.html" >
        <span class="icone-redondo">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"/></svg>
        </span>
        <span class="atalho-texto"><strong>Configurações</strong><small>Gerencie sua conta e preferências</small></span>
        <span class="atalho-seta" aria-hidden="true">›</span>
      </a>
    </nav>
  </section>
</main>

<script>IFShell.rodape()</script>

<input type="file" id="arquivoFoto" accept="image/*" hidden>

<script src="dados-perfil.js"></script>
<script src="comum.js"></script>
<script src="perfil.js"></script>
</body>
</html>
