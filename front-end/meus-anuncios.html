      <h1 id="titulo">Meus anúncios</h1>
    </div>
    <p class="sub" id="sub">Acompanhe e gerencie todos os itens que você publicou.</p>
    <div class="abas" id="abas" role="tablist"></div>
    <div class="grade" id="grade"></div>
    <div class="vazio" id="vazio" hidden></div>
  </section>
</main>

<script>IFShell.rodape()</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="dados-perfil.js"></script>
<script src="comum.js"></script>
<script src="anuncios.js"></script>

<script>
var anunciosSupabase = [];
var filtro = 'todos';
var FILT = [
  ['todos', 'Todos'],
  ['venda', 'Vendas'],
  ['doacao', 'Doações'],
  ['achado', 'Achados'],
  ['perdido', 'Perdidos'],
  ['finalizados', 'Finalizados']
];

var abas = document.getElementById('abas');
var grade = document.getElementById('grade');
var vazio = document.getElementById('vazio');

function card(a) {
  var fin = a.status === 'finalizado';
  var img = a.fotos && a.fotos[0];
  var e = IF.esc;

  return '<article class="anu" data-id="' + a.id + '" style="cursor:pointer" onclick="if(!event.target.closest(\'button,a,.menu-l\')) location.href=\'Item.html?id=' + a.id + '\'">' +
    (fin
      ? '<span class="etq etq-fin">Finalizado</span>'
      : IF.etq(a.tipo) +
        '<button class="ponto" type="button" data-menu aria-label="Opções do anúncio">⋮</button>' +
        '<div class="menu-l" hidden>' +
        '<button type="button" data-ac="editar">Editar anúncio</button>' +
        '<button type="button" data-ac="finalizar">Finalizar anúncio</button>' +
        '<button type="button" data-ac="excluir" class="perigo">Excluir anúncio</button>' +
        '</div>') +
    '<div class="anu-img">' +
      (img ? '<img src="' + img + '" alt="">' : IF.svg(IF.ico.caixa, 40)) +
    '</div>' +
    '<h3>' + e(a.titulo) +
      (a.tipo === 'venda' && a.preco != null ? '<span>' + IF.preco(a.preco) + '</span>' : '') +
    '</h3>' +
    (fin ? '<div>' + IF.etq(a.tipo) + '</div>' : '') +
    (a.local ? '<small>' + IF.svg(IF.ico.pin, 14) + e(a.local) + '</small>' : '') +
    '<small>' + IF.svg(IF.ico.rel, 14) +
      (fin ? 'Finalizado' : 'Publicado ' + IF.ha(a.criado)) +
    '</small>' +
    (fin
      ? '<div class="anu-acoes"><button type="button" class="perigo" data-ac="apagar">Excluir anúncio</button></div>'
      : '') +
  '</article>';
}

async function carregarAnunciosSupabase() {
  const { data: { user }, error: erroUsuario } =
    await clienteSupabase.auth.getUser();

  if (erroUsuario || !user) {
    vazio.hidden = false;
    vazio.textContent = 'Entre na sua conta para ver seus anúncios.';
    grade.hidden = true;
    return;
  }

  const { data, error } = await clienteSupabase
    .from('publicacoes')
    .select('*')
    .eq('usuario_id', user.id)
    .order('criado_em', { ascending: false });

  if (error) {
    console.error(error);
    vazio.hidden = false;
    vazio.textContent = 'Não foi possível carregar seus anúncios.';
    grade.hidden = true;
    return;
  }

  anunciosSupabase = (data || []).map(function(p) {
    return {
      id: String(p.id),
      tipo: p.tipo === 'encontrado' ? 'achado' : p.tipo,
      titulo: p.titulo,
      descricao: p.descricao,
      local: p.local,
      preco: p.preco,
      fotos: Array.isArray(p.fotos_urls)
        ? p.fotos_urls
        : (p.imagem_url ? [p.imagem_url] : []),
      status: p.status === 'ativo' ? 'ativo' : 'finalizado',
      criado: new Date(p.criado_em).getTime()
    };
  });

  render();
}

function render() {
  var ativos = anunciosSupabase.filter(a => a.status !== 'finalizado');
  var finalizados = anunciosSupabase.filter(a => a.status === 'finalizado');

  function cont(k) {
    if (k === 'todos') return ativos.length;
    if (k === 'finalizados') return finalizados.length;
    return ativos.filter(a => a.tipo === k).length;
  }

  abas.innerHTML = FILT.map(function(f) {
    return '<button type="button" role="tab" class="aba-btn' +
      (f[0] === filtro ? ' on' : '') +
      '" aria-selected="' + (f[0] === filtro) +
      '" data-f="' + f[0] + '">' + f[1] +
      ' <b>' + cont(f[0]) + '</b></button>';
  }).join('');

  var lista = filtro === 'finalizados'
    ? finalizados
    : filtro === 'todos'
      ? ativos
      : ativos.filter(a => a.tipo === filtro);

  lista.sort((a, b) => b.criado - a.criado);
  grade.innerHTML = lista.map(card).join('');
  grade.hidden = !lista.length;
  vazio.hidden = !!lista.length;

  if (lista.length) return;

  if (filtro === 'finalizados') {
    vazio.innerHTML = '<strong>Você ainda não possui anúncios finalizados.</strong>';
  } else if (!ativos.length) {
    vazio.innerHTML = '<strong>Você ainda não possui anúncios.</strong><p>Que tal publicar algo agora?</p><a class="btn-p" href="publicar-item.html">+ Publicar item</a>';
  } else {
    vazio.innerHTML = '<strong>Nenhum anúncio nesta categoria.</strong>';
  }
}

abas.addEventListener('click', function(e) {
  var b = e.target.closest('[data-f]');
  if (b) {
    filtro = b.dataset.f;
    render();
  }
});

document.addEventListener('click', async function(e) {
  var m = e.target.closest('[data-menu]');

  document.querySelectorAll('.menu-l').forEach(function(x) {
    if (!m || x !== m.nextElementSibling) x.hidden = true;
  });

  if (m) {
    m.nextElementSibling.hidden = !m.nextElementSibling.hidden;
    return;
  }

  var b = e.target.closest('[data-ac]');
  if (!b) return;

  e.stopPropagation();

  var cardElement = b.closest('.anu');
  var id = cardElement.dataset.id;
  var ac = b.dataset.ac;
  var anuncio = anunciosSupabase.find(a => a.id === id);

  if (ac === 'editar') {
  const formularios = {
    perdido: 'Formulário/Perdidos.html',
    achado: 'Formulário/achados.html',
    doacao: 'Formulário/Doacoes.html',
    venda: 'Formulário/Vendas.html'
  };

  const destino = formularios[anuncio.tipo];

  if (!destino) {
    alert('Tipo de anúncio não identificado.');
    return;
  }

  location.href = destino + '?editar=' + encodeURIComponent(anuncio.id);
  return;
}

  if (ac === 'finalizar') {
    if (!confirm('Deseja finalizar este anúncio?')) return;

    const { error } = await clienteSupabase
      .from('publicacoes')
      .update({ status: 'finalizado' })
      .eq('id', id);

    if (error) {
      console.error(error);
      alert('Não foi possível finalizar o anúncio: ' + error.message);
      return;
    }

    alert('Anúncio finalizado!');
    await carregarAnunciosSupabase();
    return;
  }

  if (ac === 'excluir' || ac === 'apagar') {
    if (!confirm('Deseja excluir este anúncio permanentemente?')) return;

    const { error } = await clienteSupabase
      .from('publicacoes')
      .delete()
      .eq('id', id);

    if (error) {
      console.error(error);
      alert('Não foi possível excluir o anúncio: ' + error.message);
      return;
    }

    alert('Anúncio excluído!');
    await carregarAnunciosSupabase();
  }
});

carregarAnunciosSupabase();
</script>```
