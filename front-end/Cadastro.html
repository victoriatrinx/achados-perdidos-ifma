<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - iFound</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <main class="cadastro-wrapper">

        <section class="cadastro-container">

            <div class="logo">
                <img src="imagens/logo.png" alt="Logo iFound">
                <h1>iFound</h1>
                <p>Campus Rosário</p>
            </div>

            <div class="cadastro-text">
                <h2>Crie sua conta</h2>
                <p>Cadastre-se para conectar pessoas e objetos dentro do IFMA Campus Rosário.</p>
            </div>

            <form id="cadastro-form">

                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-row">

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail acadêmico" required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="input-group">
                        <label for="curso">Curso/Setor</label>

                        <select id="curso" required>
                            <option value="" selected disabled>Selecione</option>
                            <option>Informática para Internet</option>
                            <option>Administração</option>
                            <option>Professor</option>
                            <option>Outro</option>
                        </select>

                    </div>

                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" placeholder="(98) 99999-9999" required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Crie uma senha" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmar">Confirmar senha</label>
                        <input type="password" id="confirmar" placeholder="Confirme sua senha" required>
                    </div>

                </div>

                <div class="terms-check">
                    <input type="checkbox" id="termos" required>

                    <label for="termos">
                        Concordo com os <strong>Termos de uso</strong> e a
                        <strong>Política de privacidade</strong>.
                    </label>
                </div>

                <button class="btn-primary" type="submit">
                    Criar conta
                </button>

                <div class="divider">ou</div>

                <a href="login.html" class="btn-secondary">
                    Já tenho uma conta
                </a>

            </form>

        </section>

    </main>

    <footer class="main-footer">

        <div class="footer-content">

            <img src="imagens/logo.png" alt="Logo">

            <div class="footer-text">
                <p><strong>iFound</strong> • Campus Rosário</p>
                <p>© 2024 IFMA Campus Rosário. Todos os direitos reservados.</p>
            </div>

        </div>

    </footer>

</body>

</html>
